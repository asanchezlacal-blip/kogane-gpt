<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOGANE GPT</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101018;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 650px;
      margin: 30px auto;
    }
    h1 { color: #f5c542; }
    #chat {
      min-height: 280px;
      padding: 16px;
      background: #1d1d2b;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #555;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #f5c542;
      color: #171717;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #status { color: #f5c542; }
    .error { color: #ff8d8d; }
  </style>
</head>
<body>
  <main>
    <h1>KOGANE GPT</h1>
    <p>Ask me about Jujutsu Kaisen or Jujutsu Shenanigans.</p>

    <div id="chat" aria-live="polite">KOGANE: Welcome! Ask me anything.</div>
    <p id="status"></p>

    <form id="form">
      <input id="message" type="text"
        placeholder="Write your message..."
        autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const API_URL =
      "https://super-cloud-e125.asanchezlacal.workers.dev/";

    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      chat.textContent += "\n\nYOU: " + message;
      input.value = "";
      status.textContent = "Kogane is thinking...";
      status.className = "";
      send.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok || !data.reply) {
          throw new Error(
            (data.error || "HTTP " + response.status) +
            (data.details ? ": " + data.details : "")
          );
        }

        chat.textContent += "\n\nKOGANE: " + data.reply;
        status.textContent = "";
      } catch (error) {
        status.className = "error";
        status.textContent = "ERROR: " + error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
